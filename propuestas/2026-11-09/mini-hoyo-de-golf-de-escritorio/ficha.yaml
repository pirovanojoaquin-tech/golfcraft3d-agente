nombre: Mini hoyo de golf de escritorio
nombre_original: Desktop Mini Golf Hole 1
descripcion: This is a Desktop Mini Golf that I designed. Comes with a mini putter,
  cup and rock push in obstacles ball that I have cut to either print with supports,
  or split in half and glue together (rolls better when split). I plan on doing many
  more holes to build out a whole little course with more fun obstacles in the future!
  Can all be printed on one single plate but it takes quite a bit longer than just
  separating them out. Hope you enjoy!
