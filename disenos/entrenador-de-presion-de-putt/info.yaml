nombre: Entrenador de presión para el putt
descripcion: Rampa con un hoyito arriba marcado con un aro de color. Si le pegás con la velocidad justa, la bola sube y se queda en el hoyito; corta no llega y larga pasa de largo. Entrena la velocidad, que es lo que más falla en el putt.
inspiracion: Los entrenadores de "presión" de putt que están entre los más vendidos (rampas con objetivo chico arriba). Diseño propio, sin copiar ningún producto.
piezas:
  - cuerpo.scad
  - {archivo: acento.scad, color: rojo}
