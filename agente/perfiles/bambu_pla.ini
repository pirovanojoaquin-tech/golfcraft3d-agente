# Perfil aproximado de Bambu Lab (P2S / A2L) con PLA para PrusaSlicer.
# Solo se usa para ESTIMAR gramos y tiempo; el archivo real se lamina en Bambu Studio.
printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
filament_type = PLA
temperature = 220
bed_temperature = 60
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
support_material = 0
brim_width = 0
skirts = 0
perimeter_speed = 200
external_perimeter_speed = 200
small_perimeter_speed = 150
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
gap_fill_speed = 200
bridge_speed = 50
first_layer_speed = 50
travel_speed = 500
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 10000,10000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_x = 20000,20000
machine_max_acceleration_y = 20000,20000
machine_max_feedrate_x = 500,500
machine_max_feedrate_y = 500,500
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
default_acceleration = 10000
perimeter_acceleration = 5000
infill_acceleration = 10000
first_layer_acceleration = 500
