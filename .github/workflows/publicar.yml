name: Publicar en Instagram

on:
  schedule:
    # Horarios en UTC (Argentina = UTC-3). Deben quedar unos minutos después de config.yaml > horarios.
    - cron: "7 13 * * *"    # 10:07  historia-1
    - cron: "37 15 * * *"   # 12:37  post
    - cron: "7 19 * * *"    # 16:07  historia-2
    - cron: "37 23 * * *"   # 20:37  historia-3
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [publicar, simular, verificar]
        default: publicar
      id:
        description: "(Opcional) id de una entrada a publicar ya, ej: 2026-10-20-post"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MODO: ${{ inputs.modo || 'publicar' }}
          ID: ${{ inputs.id }}
        run: |
          ARGS=()
          [ "$MODO" = "simular" ] && ARGS+=(--simular)
          [ "$MODO" = "verificar" ] && ARGS+=(--verificar)
          [ -n "$ID" ] && ARGS+=(--id "$ID")
          python -m agente.publicar "${ARGS[@]}"

      - name: Guardar estado del calendario
        if: always()
        run: |
          git config user.name "golfcraft3d-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contenido/calendario.json
          if ! git diff --cached --quiet; then
            git commit -m "Estado de publicaciones $(date -u +'%F %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
