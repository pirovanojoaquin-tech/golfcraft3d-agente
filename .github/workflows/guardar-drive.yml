name: Guardar productos en Google Drive

on:
  workflow_dispatch:
    inputs:
      productos:
        description: "Carpetas de productos/ separadas por espacio (ej: tee-de-altura-fija clip-de-gorra)"
        required: true

jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Guardar en Drive
        env:
          DRIVE_WEBAPP_URL: ${{ secrets.DRIVE_WEBAPP_URL }}
          PRODUCTOS: ${{ inputs.productos }}
        run: python -m agente.drive $PRODUCTOS
