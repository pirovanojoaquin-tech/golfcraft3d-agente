name: Tienda web

# Publica la página de tienda (GitHub Pages) cada vez que cambia un producto o una publicación de Mercado Libre.
# También dispara https://golfcraft3d.github.io (repo de la organización), que es el link de la bio.

on:
  push:
    branches: [main]
    paths:
      - "productos/*/info.yaml"
      - "productos/*/fotos/png/**"
      - "contenido/mercadolibre.json"
      - "agente/tienda.py"
      - "agente/plantillas/tienda.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tienda
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Armar la página
        run: python -m agente.tienda --salida sitio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Actualizar golfcraft3d.github.io
        continue-on-error: true  # ese repo igual se rearma solo cada hora
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run tienda.yml --repo golfcraft3d/golfcraft3d.github.io
