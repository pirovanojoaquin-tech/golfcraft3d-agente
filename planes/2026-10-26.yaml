- fecha: 2026-10-28
  post:
    caption: '¿Se te escapan los putts de un metro? Son los golpes más fáciles de ahorrar ⛳


      3 ejercicios para practicar en el green o en la alfombra de casa:

      1️⃣ La puerta: dos tees apenas más anchos que la bola, a un palmo de la bola. Si pasa sin tocarlos, saliste
      en línea.

      2️⃣ La escalera: emboká desde 1, 2 y 3 metros. Si fallás, volvés a empezar.

      3️⃣ El reloj: 4 bolas alrededor del hoyo a 1 metro. Tenés que embocar las 4 seguidas.


      Guardalo para tu próxima práctica 📌

      #putting #putt #entrenamientogolf #tipsdegolf'
    slides:
    - tipo: info
      titulo: 3 ejercicios para el putt corto
      items:
      - 'La puerta: salir siempre en línea'
      - 'La escalera: controlar la distancia'
      - 'El reloj: embocar bajo presión'
    - tipo: pasos
      producto: arco-de-putting
      titulo: 1. La puerta
      tono: verde
      pasos:
      - Poné dos tees o un arco a un palmo de la bola
      - Apenas más ancho que la bola
      - Si pasa sin tocar, saliste en línea
    - tipo: info
      titulo: 2. La escalera
      items:
      - Emboká desde 1 metro
      - Después desde 2 y desde 3 metros
      - Si fallás uno, volvés a empezar
    - tipo: info
